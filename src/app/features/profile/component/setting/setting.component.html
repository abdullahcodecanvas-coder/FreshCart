<div>

  <!-- Header -->
  <div class="mb-6">
    <h2 class="text-lg font-semibold text-gray-900">Account Settings</h2>
    <p class="text-sm text-gray-500">Update your profile information and change your password</p>
  </div>

  <div class="space-y-6">

    <!-- ================= Profile Information ================= -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">

      <form class="p-6">

        <!-- Card Title -->
        <div class="flex items-center gap-4 mb-6">
          <div class="w-12 h-12 flex items-center justify-center rounded-xl bg-green-100 text-green-600">
            <i class="fa-solid fa-user"></i>
          </div>
          <div>
            <h3 class="font-semibold text-gray-900 text-sm">Profile Information</h3>
            <p class="text-sm text-gray-500">Update your personal details</p>
          </div>
        </div>

        <div class="space-y-5">

          <!-- Full Name -->
          <div>
            <label for="fullName" class="block text-sm font-medium text-gray-800 mb-2">Full Name</label>
            <input id="fullName" type="text" placeholder="Enter your full name"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition">
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-medium text-gray-800 mb-2">Email Address</label>
            <input id="email" type="email" placeholder="Enter your email"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition">
          </div>

          <!-- Phone -->
          <div>
            <label for="phone" class="block text-sm font-medium text-gray-800 mb-2">Phone Number</label>
            <input id="phone" type="tel" placeholder="01xxxxxxxxx"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 bg-white text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition">
          </div>

        </div>

        <!-- Save Button -->
        <button type="submit"
                class="mt-6 inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-green-600 hover:bg-green-700 text-white text-sm font-medium shadow-md shadow-green-600/20 transition">
          <i class="fa-solid fa-floppy-disk text-xs"></i>
          <span>Save Changes</span>
        </button>

      </form>

      <!-- Account Information -->
      <div class="bg-gray-50 border-t border-gray-100 p-6">
        <h4 class="font-semibold text-gray-900 text-sm mb-4">Account Information</h4>

        <div class="space-y-3">
          <div class="flex items-center justify-between text-sm">
            <span class="text-gray-500">User ID</span>
            <span class="text-gray-400">—</span>
          </div>

          <div class="flex items-center justify-between text-sm">
            <span class="text-gray-500">Role</span>
            <span class="px-3 py-1 rounded-lg bg-green-100 text-green-700 text-xs font-medium">User</span>
          </div>
        </div>
      </div>

    </div>

    <!-- ================= Change Password ================= -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">

      <form>

        <!-- Card Title -->
        <div class="flex items-center gap-4 mb-6">
          <div class="w-12 h-12 flex items-center justify-center rounded-xl bg-orange-100 text-orange-600">
            <i class="fa-solid fa-lock"></i>
          </div>
          <div>
            <h3 class="font-semibold text-gray-900 text-sm">Change Password</h3>
            <p class="text-sm text-gray-500">Update your account password</p>
          </div>
        </div>

        <div class="space-y-5">

          <!-- Current Password -->
          <div>
            <label for="currentPassword" class="block text-sm font-medium text-gray-800 mb-2">Current Password</label>
            <div class="relative">
              <input id="currentPassword" type="password" placeholder="Enter your current password"
                     class="w-full px-4 py-3 pe-12 rounded-xl border border-gray-200 bg-white text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition">
              <button type="button" class="absolute inset-y-0 end-0 px-4 text-gray-400 hover:text-gray-600 transition" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- New Password -->
          <div>
            <label for="newPassword" class="block text-sm font-medium text-gray-800 mb-2">New Password</label>
            <div class="relative">
              <input id="newPassword" type="password" placeholder="Enter your new password"
                     class="w-full px-4 py-3 pe-12 rounded-xl border border-gray-200 bg-white text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition">
              <button type="button" class="absolute inset-y-0 end-0 px-4 text-gray-400 hover:text-gray-600 transition" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
            <p class="text-xs text-gray-500 mt-1.5">Must be at least 6 characters</p>
          </div>

          <!-- Confirm New Password -->
          <div>
            <label for="confirmPassword" class="block text-sm font-medium text-gray-800 mb-2">Confirm New Password</label>
            <div class="relative">
              <input id="confirmPassword" type="password" placeholder="Confirm your new password"
                     class="w-full px-4 py-3 pe-12 rounded-xl border border-gray-200 bg-white text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition">
              <button type="button" class="absolute inset-y-0 end-0 px-4 text-gray-400 hover:text-gray-600 transition" aria-label="Show password">
                <i class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>

        </div>

        <!-- Change Password Button -->
        <button type="submit"
                class="mt-6 inline-flex items-center gap-2 px-6 py-3 rounded-xl bg-orange-500 hover:bg-orange-600 text-white text-sm font-medium shadow-md shadow-orange-500/20 transition">
          <i class="fa-solid fa-lock text-xs"></i>
          <span>Change Password</span>
        </button>

      </form>

    </div>

  </div>
</div>
