<div>

  <!-- Header -->
  <div class="flex items-start justify-between gap-4 mb-6">
    <div>
      <h2 class="text-lg font-semibold text-gray-900">My Addresses</h2>
      <p class="text-sm text-gray-500">Manage your saved delivery addresses</p>
    </div>

    <button type="button"
            class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-green-600 hover:bg-green-700 text-white text-sm font-medium shadow-md shadow-green-600/20 transition">
      <i class="fa-solid fa-plus text-xs"></i>
      <span>Add Address</span>
    </button>
  </div>

  <!-- Addresses Grid -->
  <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">

    <!-- Address Card -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 flex items-start justify-between gap-4">

      <div class="flex items-start gap-4">
        <!-- Icon -->
        <div class="w-12 h-12 shrink-0 flex items-center justify-center rounded-xl bg-green-50 text-green-600">
          <i class="fa-solid fa-location-dot"></i>
        </div>

        <!-- Info -->
        <div>
          <h3 class="font-semibold text-gray-900 text-sm">Sadat City</h3>
          <p class="text-sm text-gray-500 mt-1">Sadat City</p>

          <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-3 text-xs text-gray-500">
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-phone"></i>
              01097514862
            </span>
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-city"></i>
              Sadat City
            </span>
          </div>
        </div>
      </div>

      <!-- Actions -->
      <div class="flex items-center gap-2 shrink-0">
        <button type="button"
                class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-100 text-gray-600 hover:bg-green-50 hover:text-green-600 transition"
                aria-label="Edit address">
          <i class="fa-solid fa-pen text-xs"></i>
        </button>
        <button type="button"
                class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-100 text-gray-600 hover:bg-red-50 hover:text-red-600 transition"
                aria-label="Delete address">
          <i class="fa-solid fa-trash text-xs"></i>
        </button>
      </div>

    </div>

  </div>
</div>
