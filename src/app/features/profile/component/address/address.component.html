<div>

  <!-- Header -->
  <div class="flex items-start justify-between gap-4 mb-6">
    <div>
      <h2 class="text-lg font-semibold text-gray-900">My Addresses</h2>
      <p class="text-sm text-gray-500">Manage your saved delivery addresses</p>
    </div>

    <button
  type="button"
  [disabled]="isAddressExist()"
  (click)="addressDialog.showModal()"
  class="flex items-center gap-2 px-5 py-2.5 rounded-xl bg-green-600 hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-medium transition"
>
  <i class="fa-solid fa-plus text-xs"></i>
  <span>Add Address</span>
</button>
  </div>

  <!-- Addresses Grid -->
<div class="grid grid-cols-1 xl:grid-cols-2 gap-4">

  @for (item of address(); track item._id) {
    <!-- Address Card -->
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-5 flex items-start justify-between gap-4">

      <div class="flex items-start gap-4">
        <div class="w-12 h-12 shrink-0 flex items-center justify-center rounded-xl bg-green-50 text-green-600">
          <i class="fa-solid fa-location-dot"></i>
        </div>

        <div>
          <h3 class="font-semibold text-gray-900 text-sm">{{ item.name }}</h3>
          <p class="text-sm text-gray-500 mt-1">{{ item.details }}</p>

          <div class="flex flex-wrap items-center gap-x-4 gap-y-1 mt-3 text-xs text-gray-500">
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-phone"></i>
              {{ item.phone }}
            </span>
            <span class="flex items-center gap-1.5">
              <i class="fa-solid fa-city"></i>
              {{ item.city }}
            </span>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2 shrink-0">
        <button type="button" (click)="openEdit(item, addressDialog)"
        class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-100 text-gray-600 hover:bg-green-50 hover:text-green-600 transition"
        aria-label="Edit address">
  <i class="fa-solid fa-pen text-xs"></i>
</button>
        <button
        (click)="delete(item._id)"
         type="button"
                class="w-9 h-9 flex items-center justify-center rounded-lg bg-gray-100 text-gray-600 hover:bg-red-50 hover:text-red-600 transition"
                aria-label="Delete address">
          <i class="fa-solid fa-trash text-xs"></i>
        </button>
      </div>

    </div>
  } @empty {
    <div class="col-span-full bg-white rounded-2xl border border-dashed border-gray-200 p-10 text-center text-sm text-gray-500">
      <i class="fa-solid fa-location-dot text-2xl text-gray-300 mb-3 block"></i>
      No saved addresses yet
    </div>
  }

</div>

  <!-- ================= Add Address Modal ================= -->
  <dialog #addressDialog
          (click)="$event.target === addressDialog && addressDialog.close()"
          class="m-auto w-full max-w-md p-0 rounded-2xl shadow-2xl backdrop:bg-black/50 backdrop:backdrop-blur-sm">

   <form [formGroup]="addressForm" class="bg-white p-6">

      <!-- Title -->
      <div class="flex items-center justify-between mb-6">
        <div class="flex items-center gap-3">
          <div class="w-11 h-11 flex items-center justify-center rounded-xl bg-green-100 text-green-600">
            <i class="fa-solid fa-location-dot"></i>
          </div>
          <div>
            <h3 class="font-semibold text-gray-900 text-sm">Add New Address</h3>
            <p class="text-xs text-gray-500">Enter your delivery details</p>
          </div>
        </div>

        <button type="button" (click)="addressDialog.close()"
                class="w-9 h-9 flex items-center justify-center rounded-lg text-gray-400 hover:bg-gray-100 hover:text-gray-600 transition"
                aria-label="Close">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Inputs -->
      <div class="space-y-4">

        <div>
          <label for="name" class="block text-sm font-medium text-gray-800 mb-2">Address Name</label>
          <input id="name" type="text" formControlName="name" placeholder="Home"
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition">
        </div>

        <div>
          <label for="details" class="block text-sm font-medium text-gray-800 mb-2">Details</label>
          <input id="details" type="text" formControlName="details" placeholder="Street, building, apartment"
                 class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition">
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="phone" class="block text-sm font-medium text-gray-800 mb-2">Phone</label>
            <input id="phone" type="tel" formControlName="phone" placeholder="01xxxxxxxxx"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition">
          </div>

          <div>
            <label for="city" class="block text-sm font-medium text-gray-800 mb-2">City</label>
            <input id="city" type="text" formControlName="city" placeholder="Cairo"
                   class="w-full px-4 py-3 rounded-xl border border-gray-200 text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:border-green-500 focus:ring-4 focus:ring-green-500/10 transition">
          </div>
        </div>

      </div>

      <!-- Actions -->
      <div class="flex items-center justify-end gap-3 mt-6">
        <button type="button" (click)="addressDialog.close()"
                class="px-5 py-2.5 rounded-xl bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium transition">
          Cancel
        </button>

       <button
  type="button"
    (click)="submitForm(addressDialog)"
  [disabled]="addressForm.invalid"
                  class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-green-600 hover:bg-green-700 disabled:opacity-50 disabled:cursor-not-allowed text-white text-sm font-medium shadow-md shadow-green-600/20 transition">
       <i class="fa-solid fa-floppy-disk text-xs"></i>
          <span>Save Address</span>
        </button>
      </div>

    </form>
  </dialog>

</div>
