
<section class="container mx-auto px-6 py-12">
  <div class="flex items-center justify-between mb-10">
   <app-section-title 
      [title]="'categoriesSection.title' | translate" 
      [highlight]="'categoriesSection.highlight' | translate">
    </app-section-title>
    <a routerLink="/categories"
       class="flex items-center gap-2 text-green-600 font-medium hover:text-green-700 transition">
      View All Categories
      <i class="fa-solid fa-arrow-right"></i>
    </a>
  </div>

  <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4">
  @for (category of categories(); track category._id) {
    <a
      [routerLink]="['/catergories', category._id , category.slug ]"
      class="flex flex-col items-center gap-3 bg-white rounded-lg shadow-sm hover:shadow-md hover:-translate-y-1 transition-all duration-300 py-4 px-2"
    >
      <img [src]="category.image" [alt]="category.name" class="w-20 h-20 rounded-full object-cover" />
      <span class="text-slate-700 font-medium">{{ category.name }}</span>
    </a>
  }
</div>
</section>
<app-promo-bannaer></app-promo-bannaer>
