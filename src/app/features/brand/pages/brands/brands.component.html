<!-- Header -->
<section class="bg-gradient-to-br from-violet-600 via-violet-500 to-purple-400 text-white">
  <div class="px-6 py-10">
    <nav class="mb-4 flex items-center gap-2 text-sm text-white/80">
      <a routerLink="/home" class="hover:text-white">Home</a>
      <span>/</span>
      <span class="font-semibold text-white">Brands</span>
    </nav>

    <div class="flex items-center gap-4">
      <div class="flex size-16 items-center justify-center rounded-2xl bg-white/20 shadow-lg backdrop-blur">
        <i class="fa-solid fa-tags text-2xl"></i>
      </div>
      <div>
        <h1 class="text-4xl font-bold leading-tight">Top Brands</h1>
        <p class="text-white/85">Shop from your favorite brands</p>
      </div>
    </div>
  </div>
</section>

<!-- Brands grid -->
<section class="bg-slate-50 px-6 py-6">
  <div class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-5 xl:grid-cols-6">

    @for (brand of brands(); track brand._id) {
      <a
        [routerLink]="['/brands', brand._id , brand.slug]"
        class="flex flex-col items-center rounded-2xl border border-gray-200 bg-white p-5 pb-8 shadow-sm transition hover:shadow-md"
      >
        <div class="flex w-full items-center justify-center rounded-2xl bg-slate-100 p-4">
          <img
            [src]="brand.image"
            [alt]="brand.name"
            class="h-20 w-full bg-white object-contain"
          />
        </div>
        <h3 class="mt-4 text-sm font-semibold text-gray-900">{{ brand.name }}</h3>
      </a>
    }

  </div>
</section>
