
<main class="min-h-screen relative overflow-hidden bg-[#FAFCFB] flex items-center justify-center px-5 py-12">

  <!-- Background Decorations -->
  <div class="absolute -top-24 -left-24 w-64 h-64 bg-green-100/50 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-32 -right-20 w-80 h-80 bg-green-100/60 rounded-full blur-3xl"></div>
  <div class="absolute top-20 right-20 w-3 h-3 rounded-full bg-green-200"></div>
  <div class="absolute top-1/2 left-[15%] w-3 h-3 rounded-full bg-green-300"></div>
  <div class="absolute bottom-32 left-[9%] w-5 h-5 rounded-full bg-green-200"></div>

  <!-- Decorative Icons -->
  <i class="fa-brands fa-apple absolute top-10 left-[5%] text-green-200 text-2xl"></i>
  <i class="fa-solid fa-carrot absolute top-28 right-[10%] text-green-200 text-xl"></i>
  <i class="fa-solid fa-seedling absolute bottom-20 right-[15%] text-green-200 text-3xl"></i>
  <i class="fa-solid fa-leaf absolute bottom-32 left-[9%] text-green-200 text-2xl"></i>

  <!-- Main Content -->
  <section class="relative z-10 w-full max-w-2xl flex flex-col items-center text-center">

    <!-- 404 Illustration -->
    <div class="relative mb-8">

      <div class="w-48 h-36 bg-white/80 backdrop-blur-xl rounded-3xl shadow-[0_15px_40px_rgba(22,163,74,0.10)] flex items-center justify-center">

        <i class="fa-solid fa-cart-shopping text-green-400 text-6xl"></i>

      </div>

      <!-- 404 Badge -->
      <div class="absolute -top-5 -right-6 w-20 h-20 rounded-full bg-[#16B455] border-[6px] border-white shadow-lg flex items-center justify-center">

        <span class="text-white font-bold text-xl">404</span>

      </div>

    </div>

    <!-- Loading Dots -->
    <div class="flex items-center gap-3 mb-7">
      <span class="w-2 h-2 rounded-full bg-green-400"></span>
      <span class="w-7 h-3 border-b border-green-400 rounded-full"></span>
      <span class="w-2 h-2 rounded-full bg-green-400"></span>
    </div>

    <!-- Heading -->
    <h1 class="text-3xl md:text-4xl font-bold text-[#151C2B] mb-3 tracking-tight">
      Oops! Nothing Here
    </h1>

    <!-- Description -->
    <p class="text-gray-500 text-sm md:text-base font-regular leading-relaxed max-w-md mb-9">
      Looks like this page went out of stock! Don't worry,
      there's plenty more fresh content to explore.
    </p>

    <!-- Action Buttons -->
    <div class="flex flex-wrap justify-center items-center gap-3 mb-10">

      <a
        routerLink="/"
        class="flex items-center gap-3 bg-[#16A34A] hover:bg-[#12863E] text-white px-7 py-3.5 rounded-xl font-bold text-sm shadow-lg shadow-green-600/20 transition-all duration-300 hover:-translate-y-1"
      >
        <i class="fa-solid fa-house"></i>
        Go to Homepage
      </a>

      <button
        type="button"
        (click)="goBack()"
        class="flex items-center gap-3 bg-white hover:bg-gray-50 text-slate-700 px-7 py-3.5 rounded-xl font-bold text-sm border border-gray-200 shadow-sm transition-all duration-300 hover:-translate-y-1"
      >
        <i class="fa-solid fa-arrow-left"></i>
        Go Back
      </button>

    </div>

    <!-- Popular Destinations -->
    <div class="w-full max-w-xl bg-white border border-gray-100 rounded-3xl p-5 shadow-sm">

      <p class="text-[11px] font-bold text-slate-400 tracking-wider mb-4">
        POPULAR DESTINATIONS
      </p>

      <div class="flex flex-wrap justify-center gap-2.5">

        <a
          routerLink="/products"
          class="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-green-50 text-green-700 hover:bg-green-100 text-xs font-bold transition-colors"
        >
          All Products
        </a>

        <a
          routerLink="/categories"
          class="px-4 py-2.5 rounded-xl bg-gray-100 text-slate-600 hover:bg-green-50 hover:text-green-700 text-xs font-bold transition-colors"
        >
          Categories
        </a>

        <a
          routerLink="/deals"
          class="px-4 py-2.5 rounded-xl bg-gray-100 text-slate-600 hover:bg-green-50 hover:text-green-700 text-xs font-bold transition-colors"
        >
          Today's Deals
        </a>

        <a
          routerLink="/contact"
          class="px-4 py-2.5 rounded-xl bg-gray-100 text-slate-600 hover:bg-green-50 hover:text-green-700 text-xs font-bold transition-colors"
        >
          Contact Us
        </a>

      </div>

    </div>

  </section>

</main>
